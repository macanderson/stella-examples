# ~/.config/stella/credentials.toml
#
# Written by Stella's interactive key prompt — owner-only (0600), atomic.
# One flat table keyed by provider id. Env vars (ZAI_API_KEY, …) take
# precedence over this file; a literal `api_key` in settings.json ranks last.
#
# Never commit a real version of this file anywhere.

[credentials]
zai = "sk-REPLACE-ME"
anthropic = "sk-ant-REPLACE-ME"
openai = "sk-REPLACE-ME"
deepseek = "sk-REPLACE-ME"
